name: Générateur de Veille Cyber
on:
  schedule:
    # S'exécute tous les jours à 22h00 UTC (~23h00 en France)
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4
    - name: 🐍 Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 📦 Installation des dépendances
      run: |
        pip install --no-cache-dir "mistralai==1.2.5" feedparser markdown
    - name: 🧠 Exécution de l'IA (Script Python)
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      run: python Veille/veille.py
    - name: 🚀 Commit de la nouvelle veille
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add Veille/securite/index.html Veille/techno/index.html Veille/legale/index.html Veille/hardware/index.html
        git diff --staged --quiet && echo "Aucune modification" && exit 0
        git commit -m "Automated: Mise à jour de la veille 🤖"
        git pull --rebase origin main
        git push

  # Même déploiement que pour un push manuel (dates des documents incluses)
  deploy:
    needs: generate
    uses: ./.github/workflows/deploy.yml
